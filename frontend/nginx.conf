server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Bild-Uploads (Screenshots) erlauben
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Backup herunterladen/einspielen: große Dateien, längere Laufzeit
    location = /api/backup {
        client_max_body_size 1100m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Bilderkennung: OCR/CLIP kann einige Sekunden dauern
    location /api/vision/ {
        client_max_body_size 16m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        expires 30d;
    }

    location /geo/ {
        types { application/json geojson; }
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }
}
